###########################################################
# Jerry Sun's personal site
# 自定义极简「蓝白」模板：无外部依赖，所有样式都在 assets/css/style.css
###########################################################

# --- 基本设置 --- #
title: Jerry Sun's Main Page
author: 孙家瑞
email: sunjiarui@stu.pku.edu.cn
description: "孙家瑞的个人主页与博客 | Jerry Sun's personal homepage and blog"
url: "https://mikucy7.github.io"
baseurl: "/github-pages"
lang: "zh-CN"

# --- 构建 --- #
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
timezone: "Asia/Shanghai"
date_format: "%Y-%m-%d"
permalink: /:year-:month-:day-:title/

# --- 插件（GitHub Pages 白名单内）--- #
plugins:
  - jekyll-feed    # RSS：/feed.xml
  - jekyll-sitemap

# --- 默认布局 --- #
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
