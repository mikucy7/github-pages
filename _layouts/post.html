layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: site.date_format }}</p>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/' | relative_url }}">← 返回首页</a></p>
</article>
